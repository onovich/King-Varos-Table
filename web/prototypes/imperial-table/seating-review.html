<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宴厅座椅 · 实景检查</title><style>body{margin:0;background:#191713;color:#ead9b6;font:14px Georgia,serif}canvas{display:block}nav{position:fixed;bottom:18px;left:18px;display:flex;gap:8px}button,a{padding:12px;background:#30251b;color:#ead9b6;border:1px solid #887344;cursor:pointer}#error{position:fixed;top:20px;left:20px}</style><nav><button data-view="hall">宴厅</button><button data-view="head">帝王席</button><button data-view="side">客席</button><button id="bodyGuide">坐姿估算</button><a href="../../?revision=12">返回游戏</a></nav><p id="error"></p><script type="module">
import * as T from './vendor/three.module.min.js';import {createScene} from './scene.mjs?v=12';
try{const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.75));r.setSize(innerWidth,innerHeight);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.05;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFShadowMap;document.body.prepend(r.domElement);const stage=await createScene(r);const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);const views={hall:[[17,17,23],[0,3,-4]],head:[[5.4,7.4,-2.4],[0,3.4,-10.65]],side:[[-5.4,5.8,-11.3],[-7.1,2.5,-5.8]]};const guide=new T.Group();guide.visible=false;stage.scene.add(guide);const guideMat=new T.MeshBasicMaterial({color:'#67d5d5',wireframe:true,transparent:true,opacity:.75,depthTest:true});
function segment(a,b,r){const va=new T.Vector3(...a),vb=new T.Vector3(...b),d=vb.clone().sub(va);const o=new T.Mesh(new T.CylinderGeometry(r,r,d.length(),10),guideMat);o.position.copy(va.add(vb).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());guide.add(o);}
// Approximate adult seated envelope; only this review page contains the guide.
for(const x of [-.34,.34]){segment([x,.18,-8.98],[x,2.15,-9.22],.20);segment([x,2.15,-9.22],[x,2.20,-10.55],.27);segment([x*1.65,4.0,-10.48],[x*1.65,2.64,-10.15],.14);segment([x*1.65,2.64,-10.15],[x*1.65,3.18,-8.95],.12);}
segment([0,2.20,-10.55],[0,4.40,-10.50],.53);const head=new T.Mesh(new T.SphereGeometry(.40,12,8),guideMat);head.position.set(0,4.92,-10.5);head.scale.y=1.2;guide.add(head);
document.getElementById('bodyGuide').onclick=()=>{view('head');guide.visible=true;};
function view(key){guide.visible=false;camera.position.fromArray(views[key][0]);camera.lookAt(...views[key][1]);}view('hall');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});r.setAnimationLoop(t=>{if(document.hidden)return;stage.update(t,null,null,true,camera);r.render(stage.scene,camera)});}catch(e){document.getElementById('error').textContent='场景加载失败：'+e.message;}
</script></html>
