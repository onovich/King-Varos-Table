<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172729">
  <title>King Varo's Table</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./journey.css">
  <link rel="stylesheet" href="./journey-three.css?v=12">
  <link rel="stylesheet" href="./journey-parchment.css?v=12">
</head>
<body>
  <main id="gameRoot" class="game" data-screen="title">
    <header class="game-header">
      <button id="menuButton" class="icon-button" data-j="menu">Menu</button>
      <div class="current-place"><span data-j="chapter">THE INNER SEA</span><h1 id="countryTitle">King Varo's Table</h1><small id="countryProgress"></small></div>
      <span id="mapProgress" class="map-progress"></span>
      <button id="overviewButton" data-j="overview">Whole map</button>
    </header>
    <section id="mapViewport" class="map-viewport" tabindex="0" aria-label="Map">
      <div id="mapWorld" class="map-world">
        <div id="board" class="map-board" role="grid" aria-label="Logic map"></div>
        <div id="countryLabels" class="country-labels"></div>
      </div>
      <div class="map-corner" aria-hidden="true">K · V</div>
      <div class="zoom-tools"><button id="zoomOutButton" aria-label="Zoom out">−</button><button id="focusButton" data-j="focus">Focus</button><button id="zoomInButton" aria-label="Zoom in">+</button></div>
    </section>
    <aside id="markToolbar" class="game-tools" role="group" data-i18n-aria-label="tools.label" aria-label="Board tools">
      <div class="mark-tools">
        <button data-tool="bright" aria-keyshortcuts="1" aria-pressed="true"><span class="tool-symbol sun" aria-hidden="true">☼</span><span data-i18n="tools.bright" data-j="bright">Bright</span></button>
        <button data-tool="dark" aria-keyshortcuts="2" aria-pressed="false"><span class="tool-symbol" aria-hidden="true">☾</span><span data-i18n="tools.dark" data-j="dark">Dark</span></button>
        <button data-tool="erase" aria-keyshortcuts="3" aria-pressed="false"><span class="tool-symbol" aria-hidden="true">◇</span><span data-i18n="tools.erase" data-j="erase">Erase</span></button>
        <button data-tool="move" aria-keyshortcuts="4" aria-pressed="false"><span class="tool-symbol" aria-hidden="true">↔</span><span data-j="move">Move</span></button>
      </div>
      <div class="assist-tools" role="group" data-i18n-aria-label="history.label" aria-label="Edit history">
        <button id="undoButton" aria-keyshortcuts="Control+Z Meta+Z" title="Ctrl/⌘ Z"><span aria-hidden="true">↶</span><span data-i18n="actions.undo" data-j="undo">Undo</span></button>
        <button id="redoButton" aria-keyshortcuts="Control+Y Control+Shift+Z Meta+Shift+Z" title="Ctrl Y · ⇧⌘ Z"><span aria-hidden="true">↷</span><span data-i18n="actions.redo" data-j="redo">Redo</span></button>
        <button id="hintButton"><span aria-hidden="true">◎</span><span data-j="hint">Hint</span></button>
        <button id="clearErrorsButton"><span aria-hidden="true">⌫</span><span data-j="clearErrors">Clear errors</span></button>
      </div>
    </aside>
    <section class="reading-strip" aria-label="Current note">
      <div id="lessonPanel"><span id="noteKicker"></span><p id="statusNote" role="status" aria-live="polite"></p></div>
      <button id="noteButton" data-j="read">Read</button>
      <button id="countryStoryButton" data-j="readCountry" hidden>Read country record</button>
      <button id="landscapeButton" data-j="viewLandscape" hidden>Restored coast</button>
      <button id="skipGuideButton" data-j="skip">Skip guidance</button>
    </section>
    <section id="titleScreen" class="title-screen" aria-labelledby="gameTitle">
      <div class="title-scene" aria-hidden="true"></div>
      <div class="title-content">
        <p class="eyebrow" data-j="titleKicker"></p>
        <h2 id="gameTitle"><span data-j="titleLead"></span><strong data-j="titleTail"></strong></h2>
        <p class="title-intro" data-j="titlePrologue"></p>
        <nav class="title-actions" aria-label="Journey">
          <button id="startButton" disabled data-j="newStart"></button>
          <button id="resumeButton" hidden data-j="remember"></button>
          <button id="exitButton" data-j="endAll"></button>
        </nav>
        <p id="titleSaveNotice" class="small-note" role="status"></p>
      <p id="loadError" role="alert" hidden></p>
      <button id="retryButton" hidden data-j="retry">Try again</button>
      </div>
      <p class="title-colophon" data-j="titleColophon"></p>
    </section>
  </main>
  <section id="exitScreen" class="exit-screen" hidden><p class="eyebrow" data-j="titleColophon"></p><h2 id="exitHeading" tabindex="-1" data-j="exitHeading"></h2><p data-j="exitBody"></p></section>
  <dialog id="menuDialog" class="game-dialog" aria-labelledby="menuTitle">
    <header><h2 id="menuTitle" data-j="menu">Menu</h2><button class="close-dialog" data-j="close">Close</button></header>
    <div class="menu-list">
      <button id="returnButton" class="primary" data-j="return">Return to map</button>
      <button id="titleReturnButton" data-j="backTitle">Return to title</button>
      <button id="levelBookButton" data-j="practiceLegacy">Practice & previous edition</button>
      <button id="archiveButton" data-j="archive">Collected notes</button>
      <button id="candleMotionButton" aria-pressed="true">烛光动态 / Candlelight</button>
      <button id="helpButton" data-j="help">How to play</button>
      <button id="checkButton" data-j="check">Check this map</button>
      <fieldset><legend data-j="language">Language</legend><button data-locale="zh-CN">中</button><button data-locale="en">EN</button></fieldset>
    </div>
    <p id="storageNotice" class="small-note" role="status"></p>
  </dialog>
  <dialog id="levelBookDialog" class="game-dialog" aria-labelledby="levelBookHeading">
    <header><h2 id="levelBookHeading" data-j="practiceLegacy">Practice & previous edition</h2><button class="close-dialog" data-j="close">Close</button></header>
    <p data-j="legacyExplanation">These maps keep their own progress. They are not required for the new journey.</p>
    <div id="levelBookChapters" class="menu-list"></div>
  </dialog>
  <dialog id="completionDialog" class="game-dialog story-dialog" aria-labelledby="storyTitle">
    <article><p id="storyKicker" class="eyebrow"></p><h2 id="storyTitle"></h2><p id="storyPlace" class="story-place"></p><div id="storyBody" class="story-body"></div><p id="storyReveal" class="story-body"></p><p id="storyTrace" class="story-trace"></p><button id="storyContinue" class="primary" data-j="continue">Continue</button></article>
  </dialog>
  <dialog id="readingDialog" class="game-dialog" aria-labelledby="readingTitle">
    <header><h2 id="readingTitle"></h2><button class="close-dialog" data-j="close">Close</button></header><div id="readingBody" class="story-body"></div><button id="readingBack" hidden></button>
  </dialog>
  <noscript>This game needs JavaScript. 此游戏需要启用 JavaScript。</noscript>
  <script type="module" src="./journey-app.mjs?v=12"></script>
</body>
</html>
